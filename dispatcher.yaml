timezone: America/New_York
schedule: "*/5 * * * *"
retention: 90d

# notify:
#   discord:
#     webhook: ${DISCORD_WEBHOOK_URL}
#   ntfy:
#     url: https://ntfy.sh
#     topic: my-dispatch

jobs:
  hello:
    command: echo "Hello from dispatcher"
    interval: 5m
    description: Test job

  world:
    command: echo "World"
    interval: 10m
    description: Depends on hello

  check-reboot:
    command: |
      needs-restarting
      rc=$?
      if [ $rc -eq 1 ]; then
        echo "REBOOT_NEEDED"
      else
        echo "NO_REBOOT_NEEDED"
      fi
      exit 0
    interval: 1h
    description: Check if system reboot is required
    notify: output
